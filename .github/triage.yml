# Path filters shared by `on.pr.yml` and `on.push.yml` (step-security/paths-filter).
# Every top-level key becomes a boolean output on the `triage` job; the anchors
# compose areas so a change to the build inputs implies the areas built from them.

# Manifests and toolchain pins: a change here can alter any artifact, so these
# are folded into every other area rather than gating anything on their own.
base: &base
  - ".github/triage.yml"
  - "Makefile"
  - "mise.toml"
  - "scripts/**"
  - "codecov.yml"
  - "release-please-config.json"
  - ".release-please-manifest.json"

# The Kotlin entrypoint, its native-image configuration, and the tests that
# exercise the assembled binary. Touching any of these rebuilds `madura` or
# changes what its test suites assert.
jvm: &jvm
  - *base
  - "src/*.kt"
  - "elide.pkl"
  - "native-image/**"
  - ".dev/elide.lock.v2.bin"
  - "tests/**"

workflows: &workflows
  - ".github/workflows/**"

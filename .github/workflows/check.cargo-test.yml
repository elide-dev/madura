name: "Check - Cargo Test"

# The end-to-end tests in `crates/madura/tests/e2e.rs` spawn the built binary
# with JAVA_HOME removed and assert it still compiles, so this job needs the
# real chain: the native image (via `madura_javac`'s build script) and the jlink'd
# JDK that `madura`'s build script stages `lib/{modules,ct.sym}` out of.
#
# Coverage runs in this same job rather than its own: the setup above is the
# expensive part (a native-image build plus a jlink), and instrumenting the
# existing run costs far less than paying for that chain twice. `cargo llvm-cov`
# propagates its profile settings to spawned processes, so the e2e tests measure
# the `madura` binary itself — coverage of `main.rs` comes from those spawns.
#
# The measured surface is Rust only. Everything past the `compile_javac` FFI
# boundary lives in `madura-javac.so`, which carries no Rust instrumentation.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      hosted:
        description: "Runner Host"
        required: false
        default: ""
        type: string
      coverage:
        description: "Measure coverage and upload it to Codecov"
        required: false
        default: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token; required because the repo is not public"
        required: false
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      hosted:
        description: "Runner Host"
        required: false
        default: ""
        type: string
      coverage:
        description: "Measure coverage and upload it to Codecov"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: "always"

permissions:
  contents: read # to check out code

jobs:
  test-cargo:
    name: "Rust Tests"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # to check out code
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        if: inputs.hosted != 'nsc'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: "Setup: Checkout (NSC)"
        if: inputs.hosted == 'nsc'
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9.0.0
        with:
          fetch-depth: 1
          submodules: false
      - name: "Setup: GraalVM"
        # Supplies `native-image` for elide's external driver only; JAVA_HOME
        # stays on the OpenJDK mise declares, which is what jlink reads.
        run: |
          set -euo pipefail
          home="$(./scripts/setup-graalvm.sh "${RUNNER_TEMP}/graalvm")"
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - name: "Setup: Toolchains (mise)"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install: true
          cache: true
      - name: "Setup: Rust"
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          # `.cargo/config.toml` enables `-Zbuild-std`, which needs `rust-src`.
          # `.cargo/config.toml` enables `-Zbuild-std`, which needs `rust-src`;
          # `llvm-tools` supplies the profdata/cov binaries `cargo llvm-cov` drives.
          components: rust-src, llvm-tools-preview
          cache-target: debug
          bins: cargo-nextest, cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Setup: Maven Dependencies"
        # `--fresh` is required: without it elide resolves offline against the
        # global m2 cache, which is empty on a fresh runner.
        working-directory: crates/madura_javac
        run: elide install --ecosystems maven --fresh
      - name: "Setup: Minimal JDK"
        # jlink is pinned to JAVA_HOME rather than left to PATH order: GraalVM is
        # also on PATH, and the platform image must come from the declared JDK.
        run: |
          set -euo pipefail
          make JLINK="$JAVA_HOME/bin/jlink" target/jdkroot
          echo "MADURA_JAVA_HOME=$PWD/target/jdkroot" >> "$GITHUB_ENV"
      - name: "Test: Rust"
        id: testsuite
        if: ${{ inputs.coverage }}
        # Same run as above, instrumented. A test failure must still fail the
        # job, so the report is written even on failure and the outcome is
        # carried by the step itself (see the gate below).
        run: >-
          cargo llvm-cov nextest
          --workspace
          --all-features
          --profile ci
          --lcov
          --output-path lcov.info
      - name: "Report: Coverage Summary"
        # Runs even when the tests failed: partial coverage of a failing run is
        # still worth seeing in the job summary.
        if: ${{ inputs.coverage && always() && steps.testsuite.conclusion != 'skipped' }}
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Report: Upload to Codecov"
        if: ${{ inputs.coverage && always() && hashFiles('lcov.info') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # The repo is internal, so tokenless upload is not an option.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: rust
      - name: "Gate"
        # `always()` so a failing test run still reaches this step: the report
        # and upload steps above deliberately run after a failure, and without
        # it this gate would simply be skipped.
        if: >-
          always() && (
            steps.testsuite.outcome == 'failure'
          )
        run: exit 1

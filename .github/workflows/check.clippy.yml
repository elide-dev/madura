name: "Check - Clippy"

# Linting the whole workspace is not cheap: `madura_javac`'s build script shells
# out to `elide build --no-cache`, and `madura`'s needs the jlink'd JDK, so a
# full run pays for a native-image build just to produce lints.
#
# `full: false` (the PR default) lints `madura_javac` with `--no-default-features`
# instead. That is every line of Rust logic in the workspace — `argv()` and both
# benchmark suites — minus the `native`-gated `invoke()` shim and the two build
# scripts, and it needs no JVM toolchain at all. Push-to-main runs `full: true`.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      full:
        description: "Lint the whole workspace (requires the JVM toolchain)"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      full:
        description: "Lint the whole workspace (requires the JVM toolchain)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: "always"

permissions:
  contents: read # to check out code

jobs:
  rust-clippy-analyze:
    name: "Clippy${{ inputs.full && ' (workspace)' || '' }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # to check out code
      security-events: write # to write sarif reports
      actions: read # only required by upload-sarif on a private repository
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: "Setup: GraalVM"
        # Supplies `native-image` for elide's external driver only; JAVA_HOME
        # stays on the OpenJDK mise declares, which is what jlink reads.
        if: inputs.full
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: "25"
          distribution: "graalvm"
          set-java-home: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Setup: Toolchains (mise)"
        if: inputs.full
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install: true
          cache: true
      - name: "Setup: Rust"
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          # `.cargo/config.toml` enables `-Zbuild-std`, which needs `rust-src`.
          components: clippy, rust-src
          cache-target: debug
          bins: clippy-sarif, sarif-fmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Setup: Minimal JDK"
        # `madura`'s build script stages `lib/{modules,ct.sym}` out of this tree;
        # it reads `MADURA_JAVA_HOME` only, never an ambient JAVA_HOME.
        if: inputs.full
        run: |
          set -euo pipefail
          # `--fresh`: elide otherwise resolves offline against an empty m2 cache.
          (cd crates/madura_javac && elide install --ecosystems maven --fresh)
          # jlink pinned to JAVA_HOME: GraalVM is on PATH too, and the platform
          # image must come from the declared JDK.
          make JLINK="$JAVA_HOME/bin/jlink" target/jdkroot
          echo "MADURA_JAVA_HOME=$PWD/target/jdkroot" >> "$GITHUB_ENV"
      - name: "Analysis: Clippy"
        continue-on-error: true
        env:
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            cargo clippy --workspace --all-targets --message-format=json
          else
            cargo clippy -p madura_javac --no-default-features --all-targets --message-format=json
          fi | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
      - name: "Reporting: SARIF"
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

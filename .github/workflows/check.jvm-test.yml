name: "Check - JVM Test"

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      coverage:
        description: "Measure coverage and upload it to Codecov"
        required: false
        default: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token; required because the repo is not public"
        required: false
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      coverage:
        description: "Measure coverage and upload it to Codecov"
        required: false
        default: true
        type: boolean

permissions:
  contents: read # to check out code

jobs:
  test-jvm:
    name: "JVM Tests"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # to check out code
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: "Setup: GraalVM"
        # `elide.pkl` builds the image with `driverMode = "external"`, which needs
        # a real `native-image` on PATH. Runs before mise so that mise's shims win
        # for javac; JAVA_HOME is deliberately left to mise, so GraalVM contributes
        # `native-image` and nothing else. See the script for why the 25.2.x line
        # specifically.
        run: |
          set -euo pipefail
          home="$(./scripts/setup-graalvm.sh "${RUNNER_TEMP}/graalvm")"
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - name: "Setup: Cosmo"
        run: |
          set -euo pipefail
          home="$(./scripts/setup-cosmocc.sh "${RUNNER_TEMP}/cosmo")"
      - name: "Setup: Toolchains (mise)"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install: true
          cache: true
      - name: "Setup: Verify Toolchains"
        # jlink (from JAVA_HOME) supplies the platform metadata the dist ships,
        # so JAVA_HOME must name a jimage-bearing JDK — mise's openjdk-25 here,
        # not the builder GraalVM (which contributes only native-image).
        run: |
          set -euo pipefail
          for tool in elide native-image bun; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo 'MISSING')"
          done
          printf '%-14s %s\n' "JAVA_HOME" "$JAVA_HOME"
          printf '%-14s %s\n' "GRAALVM_HOME" "${GRAALVM_HOME:-<unset>}"
          command -v elide >/dev/null
          command -v native-image >/dev/null
          test -f "$JAVA_HOME/lib/modules"
          test -f "$JAVA_HOME/lib/ct.sym"
          test -x "$JAVA_HOME/bin/jlink"
          grep -E '^(IMPLEMENTOR|JAVA_VERSION)=' "$JAVA_HOME/release" || true
      - name: "Setup: Maven Dependencies"
        run: elide install --ecosystems maven --fresh
      - name: "Test: JVM"
        id: testsuite
        run: elide test --coverage
      - name: "Report: Coverage → Codecov"
        # The JaCoCo report `elide.pkl` asks for. There is no test-results
        # upload beside it: `elide test` emits coverage only, no JUnit XML.
        if: >-
          ${{ inputs.coverage && always()
          && hashFiles('.dev/artifacts/coverage/jvm/jvm-test/jvm-test.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: .dev/artifacts/coverage/jvm/jvm-test/jvm-test.xml
          # The repo is internal, so tokenless upload is not an option.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: jvm
      - name: "Gate"
        # `always()` so a failing test run still reaches this step: the report
        # and upload steps above deliberately run after a failure, and without
        # it this gate would simply be skipped.
        if: >-
          always() && (
            steps.testsuite.outcome == 'failure'
          )
        run: exit 1

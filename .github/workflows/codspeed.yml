name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # Allows CodSpeed to trigger backtest performance analysis.
  workflow_dispatch:

permissions:
  contents: read
  # OpenID Connect authentication with CodSpeed.
  id-token: write

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain, cache and cargo-codspeed
        uses: moonrepo/setup-rust@v1
        with:
          # `.cargo/config.toml` enables `-Zbuild-std`, which needs `rust-src`.
          components: rust-src
          cache-target: benchmark
          bins: cargo-codspeed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--no-default-features` drops the `native` feature, so the JVM toolchain
      # (elide + GraalVM `native-image`) is not needed to benchmark the Rust
      # layer. `--profile benchmark` keeps unwinding enabled, which `-Zbuild-std`
      # requires for the benchmark harness.
      - name: Build the benchmark targets
        run: >-
          cargo codspeed build
          --package madura_javac
          --no-default-features
          --profile benchmark
          --measurement-mode simulation

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run --package madura_javac

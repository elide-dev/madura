name: "Job - Build"

# Builds the distribution in one job:
#
#   elide build  ->  .dev/artifacts/native-image/madura   (GraalVM native image)
#   jlink        ->  target/jdkroot/lib/{modules,ct.sym}   (platform metadata)
#   make-dist.sh ->  target/dist/{madura,lib} + tarballs
#
# The native image IS the CLI: its `main` (dev.elide.jvm.JavacInvoker) parses
# the check/compile/drop-in modes and drives javac. It resolves platform
# metadata binary-relative (`<exe>/../lib/modules`), so the dist ships the
# binary beside its `lib/{modules,ct.sym}` and needs no JDK at runtime;
# `$JAVA_HOME` and `--java-home` are fallbacks.
#
# The tarball is what gets uploaded: `actions/upload-artifact` zips its input and
# drops the executable bit, so shipping the binary directly would produce a
# non-executable file on the other side.
#
# `os` must match the runner, and matches what `make-dist.sh` derives from
# `uname -s` — that is the name in every tarball and artifact this job produces.
# Two steps are ELF-specific and are skipped off Linux: the glibc floor check,
# and harden-runner (which only instruments Ubuntu runners).

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      artifact:
        description: "Upload the assembled distribution"
        required: false
        default: true
        type: boolean
      reports:
        description: "Produce/upload reports"
        required: false
        default: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token; required because the repo is not public"
        required: false
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      artifact:
        description: "Upload the assembled distribution"
        required: false
        default: true
        type: boolean
      reports:
        description: "Produce/upload reports"
        required: false
        default: true
        type: boolean

permissions:
  contents: read # to check out code

jobs:
  build:
    name: "Distribution (cosmo)"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # to check out code
    steps:
      - name: "Setup: Harden Runner"
        # harden-runner instruments Ubuntu runners only; it cannot enforce an
        # egress policy on macOS, so the darwin leg skips it rather than
        # carrying a step that silently does nothing.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: "Setup: GraalVM"
        # `elide.pkl` builds the image with `driverMode = "external"`, which needs
        # a real `native-image` on PATH. Runs before mise so that mise's shims win
        # for javac; JAVA_HOME is deliberately left to mise, so GraalVM contributes
        # `native-image` and nothing else. See the script for why the 25.2.x line
        # specifically.
        run: |
          set -euo pipefail
          home="$(./scripts/setup-graalvm.sh "${RUNNER_TEMP}/graalvm")"
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - name: "Setup: Cosmo"
        run: |
          set -euo pipefail
          home="$(./scripts/setup-cosmocc.sh "${RUNNER_TEMP}/cosmo")"
      - name: "Setup: Toolchains (mise)"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          # `mise.toml` pulls elide from the `github:` backend, which is rate
          # limited without a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install: true
          cache: true
      - name: "Setup: Verify Toolchains"
        # jlink (from JAVA_HOME) supplies the platform metadata the dist ships,
        # so JAVA_HOME must name a jimage-bearing JDK — mise's openjdk-25 here,
        # not the builder GraalVM (which contributes only native-image).
        run: |
          set -euo pipefail
          for tool in elide native-image bun; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo 'MISSING')"
          done
          printf '%-14s %s\n' "JAVA_HOME" "$JAVA_HOME"
          printf '%-14s %s\n' "GRAALVM_HOME" "${GRAALVM_HOME:-<unset>}"
          command -v elide >/dev/null
          command -v native-image >/dev/null
          test -f "$JAVA_HOME/lib/modules"
          test -f "$JAVA_HOME/lib/ct.sym"
          test -x "$JAVA_HOME/bin/jlink"
          grep -E '^(IMPLEMENTOR|JAVA_VERSION)=' "$JAVA_HOME/release" || true
      - name: "Setup: Maven Dependencies"
        # `--fresh` is required, not optional: without it elide resolves offline
        # against the global m2 cache, which is empty on a fresh runner, and
        # fails with a bare "Failed to resolve Maven dependencies".
        run: elide install --ecosystems maven --fresh
      - name: "Build: Distribution"
        # `make all` runs `elide build --release` (the native image), jlink
        # (platform metadata), then `make-dist.sh` (stages both, builds
        # tarballs). JLINK is pinned to JAVA_HOME so the shipped metadata is
        # openjdk-25's, not the builder GraalVM's.
        run: |
          ARCH=aarch64 make all JLINK="$JAVA_HOME/bin/jlink"
          cp target/madura-linux-arm64.tar.* .
          cp target/madura-linux-arm64/madura ./madura.aarch64
          make clean
          ARCH=x86_64 make all JLINK="$JAVA_HOME/bin/jlink"
          cp target/madura-linux-amd64.tar.* .
          cp target/madura-linux-amd64/madura ./madura.x86_64
      - name: "Test: Smoke Compile"
        # Proves the uploaded artifact is a working, hermetic compiler: both the
        # builder GraalVM and JAVA_HOME are removed, so the shipped
        # `<arch>/lib/{modules,ct.sym}` beside the binary is the only source of
        # platform metadata.
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/smoke"
          rm -rf "$out"
          rc=0

          # Every invocation runs with no JDK in the environment at all: the
          # binary must find its metadata binary-relative.
          madura() { env -u JAVA_HOME -u GRAALVM_HOME ./target/dist/madura "$@"; }

          # `expect <code> <label> -- <args...>`: run madura, compare exit codes.
          # `|| got=$?` both keeps a nonzero exit from tripping `set -e` — several
          # cases here expect failure — and preserves the real status. Do not
          # rewrite this as `if ! madura ...; then got=$?; fi`: inside that branch
          # `$?` is the negation's status (always 0), so every case would pass.
          expect() {
            local want="$1" label="$2" got=0; shift 3
            madura "$@" || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$label: expected exit $want, got $got"
              rc=1
            fi
          }

          # Passthrough (no subcommand) — the `javac` stand-in path.
          if ! madura tests/smoke/simple/Hello.java -d "$out/passthrough"; then
            echo "::error::the distribution cannot compile hermetically"
            rc=1
          fi
          test -f "$out/passthrough/simple/Hello.class" || rc=1

          # compile: writes class files. check: analyzes and writes nothing.
          expect 0 "compile accepts valid source" -- \
            compile tests/smoke/simple/Hello.java -d "$out/compile"
          test -f "$out/compile/simple/Hello.class" || rc=1

          expect 0 "check accepts valid source" -- \
            check tests/smoke/simple/Hello.java -d "$out/check"
          if [ -e "$out/check" ]; then
            echo "::error::check mode wrote output to $out/check"
            rc=1
          fi

          # The broken corpus must be rejected by both modes.
          expect 1 "check rejects broken source" -- \
            check tests/smoke/broken/Sample.java
          expect 1 "compile rejects broken source" -- \
            compile tests/smoke/broken/Sample.java -d "$out/broken"

          madura --version || rc=1
          madura --release 21 tests/smoke/simple/Hello.java -d "${out}21" || rc=1
          exit "$rc"
      - name: "Test: Smoke"
        run: bun test
      - name: "build cosmo APE"
        run: |
          "$COSMO_HOME/bin/fixupobj" madura.x86_64
          "$COSMO_HOME/bin/fixupobj" madura.aarch64
          "$COSMO_HOME/bin/apelink" \
              -l "$COSMO_HOME/bin/ape-x86_64.elf" \
              -l "$COSMO_HOME/bin/ape-aarch64.elf" \
              -M "$COSMO_HOME/bin/ape-m1.c" \
              -o "madura.com" \
              madura.x86_64 madura.aarch64
          cp madura.com target/madura-linux-amd64/
          cd target/madura-linux-amd64
          zip -r madura-cosmo.zip madura.com lib/
          mv madura-cosmo.zip ../../
      - name: "Report: Distribution Size"
        env:
          TARGET: cosmo-universal
        run: |
          {
            echo "### Distribution ($TARGET)"
            echo
            echo '```'
            du -h target/madura-linux-amd64/madura.com target/dist/lib/modules madura-cosmo.zip 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Artifact: Distribution (amd64)"
        if: inputs.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: madura-cosmo-amd64
          # Both compressions ship as release assets; the uncompressed `.tar` is
          # deliberately left behind.
          path: |
            madura-linux-amd64.tar.gz
            madura-linux-amd64.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: "Artifact: Distribution (arm64)"
        if: inputs.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: madura-cosmo-arm64
          # Both compressions ship as release assets; the uncompressed `.tar` is
          # deliberately left behind.
          path: |
            madura-linux-arm64.tar.gz
            madura-linux-arm64.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: "Artifact: Distribution (cosmo)"
        if: inputs.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: madura-dist-cosmo-universal
          path: madura-cosmo.zip
          if-no-files-found: error
          retention-days: 7
      - name: "Report: Smoke Tests → Codecov"
        # `bunfig.toml` names this file; it lands in the working directory.
        if: ${{ inputs.reports && always() && hashFiles('.smoke.testreport.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./.smoke.testreport.xml
          # The repo is internal, so tokenless upload is not an option.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          # This suite exercises the assembled distribution end-to-end.
          flags: smoke
          report_type: test_results

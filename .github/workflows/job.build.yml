name: "Job - Build"

# Builds the whole chain in one job, because each stage is an input to the next:
#
#   elide build  ->  app.jar + madura-javac.{so,dylib}  (GraalVM native image)
#   jlink        ->  target/jdkroot              (java.base,java.compiler,jdk.compiler)
#   cargo build  ->  target/release/madura       (links the library, stages lib/)
#   make-dist.sh ->  target/dist/{bin,lib}       (hermetic, plus tarballs)
#
# The tarball is what gets uploaded: `actions/upload-artifact` zips its input and
# drops the executable bit, so shipping `target/dist` directly would produce a
# non-executable launcher on the other side.
#
# `os` must match the runner, and matches what `make-dist.sh` derives from
# `uname -s` — that is the name in every tarball and artifact this job produces.
# Two steps are ELF-specific and are skipped off Linux: the glibc floor check,
# and harden-runner (which only instruments Ubuntu runners).

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      os:
        description: "Operating system label (linux | darwin); must match the runner"
        required: false
        default: "linux"
        type: string
      arch:
        description: "Architecture label (amd64 | arm64); must match the runner"
        required: false
        default: "amd64"
        type: string
      hosted:
        description: "Runner Host"
        required: false
        default: ""
        type: string
      artifact:
        description: "Upload the assembled distribution"
        required: false
        default: true
        type: boolean
      reports:
        description: "Produce/upload reports"
        required: false
        default: true
        type: boolean
      glibc_floor:
        description: "Fail if the built binaries need a newer glibc than this"
        required: false
        default: "2.35"
        type: string
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      os:
        description: "Operating system label (linux | darwin); must match the runner"
        required: false
        default: "linux"
        type: string
      arch:
        description: "Architecture label (amd64 | arm64); must match the runner"
        required: false
        default: "amd64"
        type: string
      hosted:
        description: "Runner Host"
        required: false
        default: ""
        type: string
      artifact:
        description: "Upload the assembled distribution"
        required: false
        default: true
        type: boolean
      reports:
        description: "Produce/upload reports"
        required: false
        default: true
        type: boolean
      glibc_floor:
        description: "Fail if the built binaries need a newer glibc than this"
        required: false
        default: "2.35"
        type: string

env:
  CARGO_TERM_COLOR: "always"

permissions:
  contents: read # to check out code

jobs:
  build:
    name: "Distribution (${{ inputs.os }}-${{ inputs.arch }})"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # to check out code
    steps:
      - name: "Setup: Harden Runner"
        # harden-runner instruments Ubuntu runners only; it cannot enforce an
        # egress policy on macOS, so the darwin leg skips it rather than
        # carrying a step that silently does nothing.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        if: inputs.hosted != 'nsc'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: "Setup: Checkout (NSC)"
        if: inputs.hosted == 'nsc'
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9.0.0
        with:
          fetch-depth: 1
          submodules: false
      - name: "Setup: GraalVM"
        # `elide.pkl` builds the image with `driverMode = "external"`, which needs
        # a real `native-image` on PATH. Runs before mise so that mise's shims win
        # for javac/jlink; JAVA_HOME is deliberately left alone, so GraalVM
        # contributes `native-image` and nothing else. See the script for why the
        # 25.2.x line specifically.
        run: |
          set -euo pipefail
          home="$(./scripts/setup-graalvm.sh "${RUNNER_TEMP}/graalvm")"
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - name: "Setup: Toolchains (mise)"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          # `mise.toml` pulls elide from the `github:` backend, which is rate
          # limited without a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install: true
          cache: true
      - name: "Setup: Rust"
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          # `.cargo/config.toml` turns on `-Zbuild-std`, which needs the std source.
          components: rust-src
          cache-target: release
          # Both dimensions: the cache holds a linked, platform-specific
          # target dir, so linux-arm64 and darwin-arm64 must not share one.
          cache-extra-identifier: ${{ inputs.os }}-${{ inputs.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Setup: Verify Toolchains"
        # The platform image madura ships is whatever jlink emits, so the JDK
        # behind it is pinned to JAVA_HOME rather than left to PATH order —
        # GraalVM is on PATH here too and would otherwise be a coin flip.
        run: |
          set -euo pipefail
          for tool in elide native-image cargo; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo 'MISSING')"
          done
          printf '%-14s %s\n' "JAVA_HOME" "$JAVA_HOME"
          printf '%-14s %s\n' "GRAALVM_HOME" "${GRAALVM_HOME:-<unset>}"
          command -v elide >/dev/null
          command -v native-image >/dev/null
          test -x "$JAVA_HOME/bin/jlink"
          grep -E '^(IMPLEMENTOR|JAVA_VERSION)=' "$JAVA_HOME/release" || true
          echo "JLINK=$JAVA_HOME/bin/jlink" >> "$GITHUB_ENV"
      - name: "Setup: Maven Dependencies"
        # `--fresh` is required, not optional: without it elide resolves offline
        # against the global m2 cache, which is empty on a fresh runner, and
        # fails with a bare "Failed to resolve Maven dependencies".
        working-directory: crates/madura_javac
        run: elide install --ecosystems maven --fresh
      - name: "Build: Distribution"
        # `make all` is `target/jdkroot` then `target/dist`, in that order — the
        # cargo build reads `MADURA_JAVA_HOME` out of the jlink'd JDK the first
        # target produces. `JLINK` comes from the environment above; the
        # Makefile's `?=` leaves an already-set value alone.
        run: make all
      - name: "Test: Smoke Compile"
        # Proves the uploaded artifact is a working, hermetic compiler — with the
        # builder's GraalVM moved out of the way first.
        #
        # Running it in place proves nothing: native-image can freeze the
        # builder's `java.home` into the image, and javac then reads *that*
        # lib/modules. On the machine that built the binary those paths exist, so
        # a smoke test there passes while the artifact is broken for everyone
        # else. Taking the toolchain away is what makes this test mean something.
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/smoke"
          rm -rf "$out"
          mv "${RUNNER_TEMP}/graalvm" "${RUNNER_TEMP}/graalvm.hidden"
          rc=0

          # Every invocation runs without the toolchain that built the binary.
          madura() { env -u JAVA_HOME -u GRAALVM_HOME ./target/dist/bin/madura "$@"; }

          # `expect <code> <label> -- <args...>`: run madura, compare exit codes.
          # `|| got=$?` both keeps a nonzero exit from tripping `set -e` — several
          # cases here expect failure — and preserves the real status. Do not
          # rewrite this as `if ! madura ...; then got=$?; fi`: inside that branch
          # `$?` is the negation's status (always 0), so every case would pass.
          expect() {
            local want="$1" label="$2" got=0; shift 3
            madura "$@" || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$label: expected exit $want, got $got"
              rc=1
            fi
          }

          # Passthrough (no subcommand) — the `javac` stand-in path.
          if ! madura tests/smoke/simple/Hello.java -d "$out/passthrough"; then
            echo "::error::the distribution cannot compile without the toolchain that built it"
            rc=1
          fi
          test -f "$out/passthrough/simple/Hello.class" || rc=1

          # compile: writes class files. check: analyzes and writes nothing.
          expect 0 "compile accepts valid source" -- \
            compile tests/smoke/simple/Hello.java -d "$out/compile"
          test -f "$out/compile/simple/Hello.class" || rc=1

          expect 0 "check accepts valid source" -- \
            check tests/smoke/simple/Hello.java -d "$out/check"
          if [ -e "$out/check" ]; then
            echo "::error::check mode wrote output to $out/check"
            rc=1
          fi

          # The broken corpus must be rejected by both modes.
          expect 1 "check rejects broken source" -- \
            check tests/smoke/broken/Sample.java
          expect 1 "compile rejects broken source" -- \
            compile tests/smoke/broken/Sample.java -d "$out/broken"

          madura --version || rc=1
          madura --release 21 tests/smoke/simple/Hello.java -d "${out}21" || rc=1

          mv "${RUNNER_TEMP}/graalvm.hidden" "${RUNNER_TEMP}/graalvm"
          exit "$rc"
      - name: "Test: glibc Floor"
        # The distribution has to run on older hosts than the one that built it —
        # CodSpeed's macro runners are Ubuntu 22.04 (2.35), and that is where the
        # walltime benchmarks execute. A C23-default compiler silently lifts this
        # floor to 2.38 via `__isoc23_*`, so it is checked rather than assumed.
        #
        # Nothing to check on Mach-O: there is no glibc, and the deployment
        # target is what bounds compatibility there instead.
        if: runner.os == 'Linux'
        env:
          FLOOR: ${{ inputs.glibc_floor }}
        run: |
          set -euo pipefail
          rc=0
          for f in ./target/dist/bin/madura ./target/dist/lib/*.so; do
            highest="$(objdump -T "$f" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
              | sed 's/GLIBC_//' \
              | sort -uV \
              | tail -1)"
            printf '%-40s needs glibc %s\n' "$(basename "$f")" "$highest"
            if [ "$(printf '%s\n%s\n' "$FLOOR" "$highest" | sort -V | tail -1)" != "$FLOOR" ]; then
              echo "::error::$(basename "$f") needs glibc $highest, above the $FLOOR floor"
              rc=1
            fi
          done
          exit "$rc"
      - name: "Test: Smoke"
        run: bun test
      - name: "Report: Distribution Size"
        env:
          TARGET: ${{ inputs.os }}-${{ inputs.arch }}
        run: |
          {
            echo "### Distribution ($TARGET)"
            echo
            echo '```'
            du -h target/dist/bin/madura target/dist/lib/* "target/madura-$TARGET".tar.* 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Artifact: Distribution"
        if: inputs.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: madura-dist-${{ inputs.os }}-${{ inputs.arch }}
          # Both compressions ship as release assets. The benchmark job globs
          # `*.tar.gz` out of this same artifact, so adding `.tar.xz` alongside
          # it is additive; the uncompressed `.tar` is deliberately left behind.
          path: |
            target/madura-${{ inputs.os }}-${{ inputs.arch }}.tar.gz
            target/madura-${{ inputs.os }}-${{ inputs.arch }}.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: "Report: Smoke Tests → Codecov"
        # `bunfig.toml` names this file; it lands in the working directory.
        if: ${{ inputs.reports && always() && hashFiles('.smoke.testreport.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./.smoke.testreport.xml
          # The repo is internal, so tokenless upload is not an option.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          # Its own flag: this suite exercises the assembled distribution
          # end-to-end, not the Rust unit tests uploaded under `rust`.
          flags: smoke
          report_type: test_results

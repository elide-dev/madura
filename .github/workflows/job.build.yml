name: "Job - Build"

# Builds the whole chain in one job, because each stage is an input to the next:
#
#   elide build  ->  app.jar + madura-javac.so   (GraalVM native image)
#   jlink        ->  target/jdkroot              (java.base,java.compiler,jdk.compiler)
#   cargo build  ->  target/release/madura       (links the .so, stages lib/)
#   make-dist.sh ->  target/dist/{bin,lib}       (hermetic, plus tarballs)
#
# The tarball is what gets uploaded: `actions/upload-artifact` zips its input and
# drops the executable bit, so shipping `target/dist` directly would produce a
# non-executable launcher on the other side.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      hosted:
        description: "Runner Host"
        required: false
        default: ""
        type: string
      artifact:
        description: "Upload the assembled distribution"
        required: false
        default: true
        type: boolean
      artifact_name:
        description: "Name for the uploaded distribution"
        required: false
        default: "madura-dist"
        type: string
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: false
        default: "ubuntu-latest"
        type: string
      hosted:
        description: "Runner Host"
        required: false
        default: ""
        type: string
      artifact:
        description: "Upload the assembled distribution"
        required: false
        default: true
        type: boolean
      artifact_name:
        description: "Name for the uploaded distribution"
        required: false
        default: "madura-dist"
        type: string

env:
  CARGO_TERM_COLOR: "always"

permissions:
  contents: read # to check out code

jobs:
  build:
    name: "Distribution (linux-amd64)"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read # to check out code
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        if: inputs.hosted != 'nsc'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: "Setup: Checkout (NSC)"
        if: inputs.hosted == 'nsc'
        uses: namespacelabs/nscloud-checkout-action@445c25d7009680597d73eb03c4e1cd5be522ed73 # v9.0.0
        with:
          fetch-depth: 1
          submodules: false
      - name: "Setup: Toolchains (mise)"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          # `mise.toml` pulls elide from the `github:` backend, which is rate
          # limited without a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install: true
          cache: true
      - name: "Setup: Rust"
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          # `.cargo/config.toml` turns on `-Zbuild-std`, which needs the std source.
          components: rust-src
          cache-target: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Setup: Verify Toolchains"
        run: |
          set -euo pipefail
          for tool in elide jlink javac cargo; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo 'MISSING')"
          done
          command -v elide >/dev/null && command -v jlink >/dev/null
      - name: "Setup: Maven Dependencies"
        # Resolved from the committed `.dev/elide.lock.v2.bin`; done up front so a
        # dependency failure is reported as such rather than inside `build.rs`.
        working-directory: crates/madura_javac
        run: elide install --ecosystems maven
      - name: "Build: Distribution"
        # `make all` is `target/jdkroot` then `target/dist`, in that order — the
        # cargo build reads `MADURA_JAVA_HOME` out of the jlink'd JDK the first
        # target produces.
        run: make all
      - name: "Test: Smoke Compile"
        # Proves the uploaded artifact is a working, hermetic compiler: no
        # JAVA_HOME, run from the dist layout, output actually on disk.
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/smoke"
          rm -rf "$out"
          env -u JAVA_HOME ./target/dist/bin/madura tests/smoke/simple/Hello.java -d "$out"
          test -f "$out/simple/Hello.class"
          env -u JAVA_HOME ./target/dist/bin/madura --version
      - name: "Report: Distribution Size"
        run: |
          {
            echo "### Distribution"
            echo
            echo '```'
            du -h target/dist/bin/madura target/dist/lib/* target/madura-linux-amd64.tar.* 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Artifact: Distribution"
        if: inputs.artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: target/madura-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

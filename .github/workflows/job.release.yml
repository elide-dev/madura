name: "Job - Release"

# Release automation, in two halves:
#
#   release-please  maintains a Release PR on `main` from conventional commits,
#                   bumping the version in package.json and CHANGELOG.md.
#                   Merging that PR creates a *draft* GitHub Release.
#   assets          fills that draft with the per-platform tarballs the build
#                   matrix already produced in *this same workflow run*, then
#                   publishes it.
#
# The draft matters: with immutable releases enabled, a published release
# rejects asset uploads outright ("HTTP 422: Cannot upload assets to an
# immutable release"), which is exactly how v1.0.1 shipped with none. GitHub's
# own guidance is to create the release as a draft, attach everything, and
# publish last — immutability is applied at publish. That ordering is also
# strictly better without immutability: a failed upload leaves an unpublished
# draft rather than a published release advertising binaries that do not
# exist. `draft: true` in release-please-config.json is the other half of this.
#
# `draft: true` needs `force-tag-creation: true` beside it, and the pairing is
# not optional. GitHub does not create a tag ref for a draft release — the tag
# materializes at publish — so if this job fails before the publish step, the
# manifest names a version with no anchor in git. release-please's next run then
# matches zero releases (a draft's tagName does not even survive
# `TagName.parse`), concludes it needs to bootstrap, and rescans history back to
# `bootstrap-sha`. That is how v1.2.0's failed asset upload produced a release
# PR proposing 1.0.0: the unbounded rescan swept commit 2bcb58b back into scope,
# and a `Release-As:` footer overrides the computed bump outright.
# `force-tag-creation` pushes `refs/tags/<tag>` before creating the release, so
# the anchor exists no matter which later step fails. `bootstrap-sha` is pinned
# to v1.1.0's commit for the same reason: it caps the blast radius of a
# bootstrap to commits after that footer.
#
# The second half consumes artifacts rather than rebuilding: the caller runs the
# build job first and passes its result in, so a release ships exactly the
# binary that was smoke-tested, and nothing is compiled twice. That is also why
# this runs from `on.push.yml` rather than on a
# `release: published` trigger — by then the run holding the artifacts is over.
#
# Do NOT add `package-name` to release-please-config.json (the schema forbids
# comments, so the warning lives here). With `include-component-in-tag: false`
# the release branch carries no component, but release-please's
# getBranchComponent() ignores that flag and falls back to the package name.
# The mismatch is silent and one-way: the release PR opens and merges fine,
# then the release is skipped with "PR component: undefined does not match
# configured component", leaving the PR stuck on `autorelease: pending` and
# this workflow's assets job skipped. `component: ""` does not help either —
# it is falsy, so the same fallback fires.

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: "Artifact name prefix uploaded by the build matrix"
        required: false
        default: "madura-dist"
        type: string
      targets:
        description: "JSON array of {os, arch} platforms to attach to the release"
        required: false
        default: >-
          [{"os": "cosmo", "arch": "universal"}]
        type: string
  workflow_dispatch:
    inputs:
      artifact_prefix:
        description: "Artifact name prefix uploaded by the build matrix"
        required: false
        default: "madura-dist"
        type: string
      targets:
        description: "JSON array of {os, arch} platforms to attach to the release"
        required: false
        default: >-
          [{"os": "cosmo", "arch": "universal"}]
        type: string

permissions:
  contents: read # to check out code

jobs:
  release-please:
    name: "Release PR"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create tags and releases
      pull-requests: write # to open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Release: Please"
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  assets:
    name: "Release Assets"
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to upload release assets
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Distributions"
        # Artifacts from this run, filtered by prefix: the build job uploads the
        # per-arch ELF tarballs without `madura-dist-`, so only release
        # candidates are fetched and nothing is downloaded to be ignored. The
        # merge-multiple flatten is what lets a single download step collect
        # every `${prefix}-*` artifact into one directory. Archive names are
        # unique across platforms, so flattening cannot collide.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact_prefix }}-*
          path: dist-artifacts
          merge-multiple: true
      - name: "Release: Stage Assets"
        # The tarballs are built with an unversioned name so the benchmark
        # pipeline can glob them; release assets are renamed to carry the
        # version, because a downloaded `madura-cosmo-universal.zip` is
        # indistinguishable from every other release once it is on disk.
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          rc=0
          # `os/arch` per line: jq emits the pair, and the split below avoids
          # needing a second read field, which `-r` would split on whitespace.
          while read -r target; do
            os="${target%%/*}"
            arch="${target##*/}"
            found=0
            for ext in tar.gz tar.xz zip; do
              src="dist-artifacts/madura-${os}-${arch}.${ext}"
              if [ -f "$src" ]; then
                cp "$src" "release-assets/madura-${VERSION}-${os}-${arch}.${ext}"
                found=1
              fi
            done
            if [ "$found" = 0 ]; then
              echo "::error::no distribution artifact found for ${os}-${arch}"
              rc=1
            fi
          done < <(echo "$TARGETS" | jq -r '.[] | "\(.os)/\(.arch)"')
          if [ "$rc" != 0 ]; then
            # Without this the only clue is the target name, while the actual
            # mismatch is always between the file name the build job wrote and
            # the `madura-${os}-${arch}.${ext}` pattern above.
            echo "::group::contents of dist-artifacts"
            ls -la dist-artifacts
            echo "::endgroup::"
            exit "$rc"
          fi

          # Checksums are generated over the final names, from inside the
          # directory, so the file verifies with a bare `sha256sum -c`.
          ( cd release-assets && sha256sum -- * > SHA256SUMS )
          ls -la release-assets
      - name: "Release: Upload Assets"
        # The release is still a draft here, so this succeeds even with
        # immutable releases enabled.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: "Release: Publish"
        # Publishing is the last step and the point of no return: it creates the
        # git tag and, under immutable releases, freezes the assets. Guarded on
        # isDraft so a re-run against an already-published release is a no-op
        # rather than an error (a published immutable release accepts edits to
        # nothing but its title and notes).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            echo "published $TAG"
          else
            echo "$TAG is already published; nothing to do"
          fi
      - name: "Report: Release Summary"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "### Release $TAG"
            echo
            echo '```'
            cat release-assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

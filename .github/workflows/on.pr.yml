name: PR

"on":
  pull_request:
    branches-ignore:
      - renovate/configure

permissions:
  contents: read # by default, read-only on contents only

concurrency:
  group: "pr-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  triage:
    name: "Triage"
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: "read" # to check out source code
    outputs:
      base: ${{ steps.filter.outputs.base }}
      jvm: ${{ steps.filter.outputs.jvm }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            .github/triage.yml
      - name: "Triage: PR Changes"
        id: filter
        uses: step-security/paths-filter@5c5241b8233e77b55b9046daf88f1cb7560281de # v4.0.1
        with:
          filters: .github/triage.yml

  build:
    name: "Build"
    needs: [triage]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'ci:no-build') && (
        fromJSON(needs.triage.outputs.jvm) || fromJSON(needs.triage.outputs.workflows)
      )
    uses: ./.github/workflows/job.build.yml
    permissions:
      contents: read # to check out source code
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:no-fail-fast') }}
      matrix:
        include:
          - runner: ubuntu-latest
    with:
      runner: ${{ matrix.runner }}

  test-jvm:
    name: "Test"
    needs: [triage]
    if: fromJSON(needs.triage.outputs.jvm)
    uses: ./.github/workflows/check.jvm-test.yml
    permissions:
      contents: read # to check out source code
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  gate:
    name: "Gate"
    if: always() && github.event.pull_request.draft == false
    needs: [build, test-jvm]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.test-jvm.result }}
        run: |
          echo "Build:    $BUILD"
          echo "Tests:    $TESTS"

          # `skipped` is a pass: triage decided the area was untouched. Only a
          # job that actually ran and did not succeed fails the gate.
          rc=0
          for pair in "Build:$BUILD" "Tests:$TESTS"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name job unexpectedly failed on PR"
              rc=1
            fi
          done
          exit "$rc"

name: CI

"on":
  push:
    branches:
      - main
      - stable
      - release/*
  workflow_dispatch: {}

permissions:
  contents: read # by default, read-only on contents only

concurrency:
  group: "push-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  triage:
    name: "Triage"
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: "read" # to check out source code
    outputs:
      base: ${{ steps.filter.outputs.base }}
      jvm: ${{ steps.filter.outputs.jvm }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 5
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            .github/triage.yml
      - name: "Triage: Push Changes"
        id: filter
        uses: step-security/paths-filter@5c5241b8233e77b55b9046daf88f1cb7560281de # v4.0.1
        with:
          filters: .github/triage.yml

  build:
    name: "Build"
    needs: [triage]
    uses: ./.github/workflows/job.build.yml
    permissions:
      contents: read # to check out source code
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          # Apple silicon only: the 25.2.x GraalVM line publishes no macos-x64
          # archive on GDS, so Intel macOS has no builder. `macos-15` is pinned
          # rather than `macos-latest`, which floats to the next image.
          - os: darwin
            arch: arm64
            runner: macos-15
    with:
      runner: ${{ matrix.runner }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}

  test-jvm:
    name: "Test"
    needs: [triage]
    uses: ./.github/workflows/check.jvm-test.yml
    permissions:
      contents: read # to check out source code
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: "Release"
    # Main only, and only behind a green build: merging the release PR is what
    # cuts a release, and the assets job attaches the tarballs this very run
    # produced — so the build matrix has to have finished successfully first.
    needs: [build]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    uses: ./.github/workflows/job.release.yml
    permissions:
      contents: write # to tag, release, and upload assets
      pull-requests: write # to open and update the release PR

# Codecov configuration. Two flags feed it: `jvm` is JaCoCo coverage of the
# Kotlin entrypoint (`elide test`), and `smoke` is the end-to-end test-results
# report from the bun suite exercising the assembled binary.

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        # A drop this small is usually a refactor moving lines around, not a
        # test regression; larger drops are worth a look.
        threshold: 1%
        informational: false
    patch:
      default:
        # New code should carry tests, but a patch that is mostly comments
        # should not block a merge.
        threshold: 5%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  # Test sources themselves.
  - "tests/**"
